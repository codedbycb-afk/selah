<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Selah">
<title>Selah — Scroll the Word</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- gate: onboarding / profile picker / PIN lock -->
<div class="gate" id="gate"></div>

<!-- app shell -->
<div id="shell" style="display:none">

  <div class="topbar" id="topbar">
    <div class="brand"><b>SELAH</b><span>scroll the word</span></div>
    <button class="pill book" id="openSaved" aria-label="Kept verses">
      <svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
      Kept
    </button>
  </div>

  <div id="app">
    <!-- READ -->
    <section class="view active" id="view-read">
      <main id="feed" aria-label="Scripture feed"></main>
      <div class="hint" id="hint">Swipe up ↑</div>
    </section>
    <!-- LEARN -->
    <section class="view" id="view-learn"><div class="scroll" id="learn-body"></div></section>
    <!-- TRACK -->
    <section class="view" id="view-track"><div class="scroll" id="track-body"></div></section>
    <!-- ME -->
    <section class="view" id="view-me"><div class="scroll" id="me-body"></div></section>
  </div>

  <nav class="nav">
    <button data-go="read" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5c3 0 6 1 8 2 2-1 5-2 8-2v14c-3 0-6 1-8 2-2-1-5-2-8-2V5z"/><path d="M12 7v12"/></svg><span class="l">Read</span></button>
    <button data-go="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M6 10v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg><span class="l">Learn</span></button>
    <button data-go="track"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="l">Track</span></button>
    <button data-go="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg><span class="l">Me</span></button>
  </nav>
</div>

<!-- lesson runner -->
<div class="lesson" id="lesson">
  <div class="lesson-top">
    <button class="x" id="lessonX" aria-label="Close">×</button>
    <div class="progress"><i></i></div>
    <div class="hearts"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.35-9.5-8.5C.5 9 2 5.5 5.2 5.5c1.9 0 3.1 1.1 3.8 2.1.7-1 1.9-2.1 3.8-2.1C16 5.5 17.5 9 15.5 12.5 13 16.65 12 21 12 21z"/></svg><span id="hearts-n">5</span></div>
  </div>
  <div class="lesson-body"></div>
  <div class="lesson-foot"></div>
</div>

<!-- saved drawer -->
<section class="sheet" id="sheet">
  <div class="sheet-h"><h2>Kept verses</h2><button class="x" id="closeSaved">×</button></div>
  <div class="body" id="savedList"></div>
</section>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
/* installable PWA — inline manifest, no external files */
(function(){
  const m={name:"Selah",short_name:"Selah",start_url:".",display:"standalone",background_color:"#07070c",theme_color:"#07070c",orientation:"portrait",description:"Scroll the Word.",
    icons:[{src:"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="512" height="512" fill="#07070c"/><text x="256" y="352" font-size="300" text-anchor="middle" fill="#e6c473" font-family="Georgia,serif">S</text></svg>'),sizes:"512x512",type:"image/svg+xml"}]};
  const b=new Blob([JSON.stringify(m)],{type:'application/manifest+json'});
  const l=document.createElement('link'); l.rel='manifest'; l.href=URL.createObjectURL(b); document.head.appendChild(l);
})();
</script>
</body>
</html>
