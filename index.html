<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Selah">
<title>Selah — Scroll the Word</title>
<style>
  :root{
    --ink:#f3ecd9;          /* parchment text */
    --ink-soft:#cbb98f;     /* aged gold */
    --gold:#d9b45f;         /* illuminated accent */
    --bg:#0b0e1a;
    --rail:rgba(243,236,217,.9);
    --card-pad: clamp(26px, 7vw, 60px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; background:var(--bg); overscroll-behavior:none;}
  body{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow:hidden;
  }

  /* ---------- Feed ---------- */
  #feed{
    height:100dvh;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  #feed::-webkit-scrollbar{display:none;}

  .verse{
    position:relative;
    height:100dvh;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding: calc(env(safe-area-inset-top) + 84px) var(--card-pad) calc(env(safe-area-inset-bottom) + 120px);
    overflow:hidden;
    isolation:isolate;
  }
  /* ambient godray + grain layers */
  .verse::before{
    content:"";
    position:absolute; inset:-20% -20% auto -20%; height:80%;
    background:radial-gradient(120% 70% at 30% 0%, rgba(255,255,255,.16), rgba(255,255,255,0) 60%);
    mix-blend-mode:screen; pointer-events:none; z-index:0;
    animation:drift 26s ease-in-out infinite alternate;
  }
  .verse::after{
    content:"";
    position:absolute; inset:0; pointer-events:none; z-index:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.035'/></svg>");
    /* soft vignette on top of grain */
    box-shadow:inset 0 0 200px 40px rgba(0,0,0,.55);
    opacity:.9;
  }
  @keyframes drift{ from{transform:translate3d(-4%,0,0) scale(1.05);} to{transform:translate3d(4%,2%,0) scale(1.15);} }

  .verse > *{position:relative; z-index:1;}

  .ref{
    font-size:.72rem; letter-spacing:.34em; text-transform:uppercase;
    color:var(--ink-soft); font-weight:600;
    display:flex; align-items:center; gap:.7em; margin:0 0 clamp(20px,4.5vh,40px);
    opacity:0; transform:translateY(10px);
  }
  .ref::before{ content:""; width:26px; height:1px; background:var(--gold); opacity:.85; }

  .text{
    font-size:clamp(1.7rem, 4.4vw + 1rem, 3.15rem);
    line-height:1.32; font-weight:400; letter-spacing:.002em;
    max-width:16em; text-wrap:balance;
    text-shadow:0 1px 30px rgba(0,0,0,.35);
    opacity:0; transform:translateY(16px);
  }
  .text .cap{
    float:left; font-size:3.1em; line-height:.72; padding:.06em .12em 0 0;
    color:var(--gold); font-weight:600;
  }

  /* reveal when card is the active snap target */
  .verse.live .ref{ animation:rise .7s .05s cubic-bezier(.2,.8,.2,1) forwards; }
  .verse.live .text{ animation:rise .8s .12s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes rise{ to{opacity:1; transform:none;} }

  /* ---------- Right action rail ---------- */
  .rail{
    position:absolute; right:clamp(12px,4vw,22px);
    bottom:calc(env(safe-area-inset-bottom) + 30px);
    display:flex; flex-direction:column; gap:22px; z-index:2;
  }
  .rail button{
    all:unset; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:5px;
    color:var(--rail); width:48px;
  }
  .rail svg{ width:27px; height:27px; filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)); transition:transform .18s ease; }
  .rail button:active svg{ transform:scale(.82); }
  .rail .lab{ font-size:.62rem; letter-spacing:.06em; opacity:.85; font-variant-numeric:tabular-nums;
    font-family:ui-sans-serif,system-ui,sans-serif; }
  .rail button.on svg{ fill:var(--gold); stroke:var(--gold); color:var(--gold); }
  .rail button.on .lab{ color:var(--gold); opacity:1; }
  @keyframes pop{ 40%{transform:scale(1.3);} 70%{transform:scale(.9);} 100%{transform:scale(1);} }
  .rail button.burst svg{ animation:pop .4s ease; }

  /* ---------- Top bar ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 16px) 22px 14px;
    background:linear-gradient(to bottom, rgba(0,0,0,.42), rgba(0,0,0,0));
    pointer-events:none;
  }
  header *{pointer-events:auto;}
  .brand{ display:flex; align-items:baseline; gap:.5em; }
  .brand b{ font-size:1.18rem; font-weight:600; letter-spacing:.14em; color:var(--ink);}
  .brand span{ font-size:.6rem; letter-spacing:.32em; text-transform:uppercase; color:var(--ink-soft); }
  .savedBtn{ all:unset; cursor:pointer; display:flex; align-items:center; gap:7px; color:var(--ink);
    font-family:ui-sans-serif,system-ui,sans-serif; font-size:.8rem; padding:7px 12px; border-radius:999px;
    background:rgba(255,255,255,.08); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(243,236,217,.14);}
  .savedBtn svg{width:16px;height:16px;fill:var(--gold);}

  /* ---------- Scroll hint ---------- */
  .hint{
    position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 22px);
    text-align:center; z-index:4; pointer-events:none;
    color:var(--ink-soft); font-size:.68rem; letter-spacing:.28em; text-transform:uppercase;
    font-family:ui-sans-serif,system-ui,sans-serif;
    animation:hintPulse 2.4s ease-in-out infinite;
    transition:opacity .5s;
  }
  .hint svg{ display:block; margin:6px auto 0; width:18px; height:18px; stroke:var(--ink-soft); }
  @keyframes hintPulse{ 0%,100%{opacity:.35; transform:translateY(0);} 50%{opacity:.9; transform:translateY(4px);} }

  /* ---------- Saved drawer ---------- */
  .sheet{
    position:fixed; inset:0; z-index:20; background:rgba(6,8,14,.86);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    display:flex; flex-direction:column; transform:translateY(100%); transition:transform .34s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.open{ transform:none; }
  .sheet header{ position:static; background:none; padding:calc(env(safe-area-inset-top) + 20px) 22px 14px; }
  .sheet h2{ margin:0; font-size:1.3rem; font-weight:600; letter-spacing:.06em;}
  .sheet .close{ all:unset; cursor:pointer; font-size:1.7rem; color:var(--ink-soft); line-height:1;}
  .sheet .list{ overflow-y:auto; padding:6px 22px calc(env(safe-area-inset-bottom) + 30px); }
  .savedItem{ padding:20px 0; border-top:1px solid rgba(243,236,217,.1);}
  .savedItem .r{ font-size:.64rem; letter-spacing:.28em; text-transform:uppercase; color:var(--gold); margin-bottom:8px;}
  .savedItem .t{ font-size:1.12rem; line-height:1.4;}
  .savedItem button{ all:unset; cursor:pointer; color:var(--ink-soft); font-size:.72rem; margin-top:10px;
    font-family:ui-sans-serif,system-ui,sans-serif; letter-spacing:.05em;}
  .empty{ color:var(--ink-soft); text-align:center; padding:22vh 30px; line-height:1.6;}
  .empty b{display:block;color:var(--ink);font-size:1.15rem;margin-bottom:8px;letter-spacing:.04em;}

  .toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 92px); transform:translate(-50%,20px);
    background:rgba(20,18,12,.94); color:var(--ink); border:1px solid rgba(217,180,95,.35);
    padding:11px 20px; border-radius:999px; font-size:.8rem; letter-spacing:.03em; z-index:30;
    font-family:ui-sans-serif,system-ui,sans-serif; opacity:0; pointer-events:none; transition:.25s;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  @media (prefers-reduced-motion:reduce){
    .verse::before{animation:none;}
    .verse .ref,.verse .text{animation:none;opacity:1;transform:none;}
    .hint{animation:none;}
    #feed{scroll-behavior:auto;}
  }
</style>
</head>
<body>

<header>
  <div class="brand"><b>SELAH</b><span>scroll the word</span></div>
  <button class="savedBtn" id="openSaved" aria-label="Saved verses">
    <svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
    <span id="savedCount">0</span>
  </button>
</header>

<main id="feed" aria-label="Scripture feed"></main>

<div class="hint" id="hint">Swipe up

</div>

<!-- Saved drawer -->
<section class="sheet" id="sheet" aria-hidden="true">

    <h2>Kept verses</h2>
    <button class="close" id="closeSaved" aria-label="Close">×</button>

  <div class="list" id="savedList"></div>
</section>

<div class="toast" id="toast"></div>

const THEMES = [

  {bg:"linear-gradient(160deg,#2a1327 0%,#5c2740 50%,#20101f 100%)"},   // dawn rose

/* ---------- state ---------- */
const feed = document.getElementById('feed');
const saved = JSON.parse(localStorage.getItem('selah.saved')||'[]');
let deck = [];        // shuffled queue of [ref,text]
let served = 0;       // total cards rendered
let recent = new Set();

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function refillDeck(){ deck = deck.concat(shuffle(POOL)); }

function nextVerse(){
  if(deck.length<3) refillDeck();
  // avoid immediate repeats
  let v = deck.shift();
  let guard=0;
  while(recent.has(v[0]) && deck.length>4 && guard++<8){ deck.push(v); v=deck.shift(); }
  recent.add(v[0]); if(recent.size>18){ recent = new Set([...recent].slice(-12)); }
  return v;
}

function isSaved(ref){ return saved.some(s=>s[0]===ref); }
function svg(name){
  const P={
    heart:'<path d="M12 21s-7-4.35-9.5-8.5C.5 9 2 5.5 5.2 5.5c1.9 0 3.1 1.1 3.8 2.1.7-1 1.9-2.1 3.8-2.1C16 5.5 17.5 9 15.5 12.5 13 16.65 12 21 12 21z"/>',
    copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h8"/>',
    share:'<path d="M12 3v13"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>'
  };
  const filled = name==='heart';
  return `<svg viewBox="0 0 24 24" ${filled?'fill="none"':'fill="none"'} stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${P[name]}</svg>`;
}

function makeCard(ref,text){
  const el = document.createElement('article');
  el.className='verse';
  const t = THEMES[served % THEMES.length];
  el.style.background = t.bg;
  const words = text.trim();
  const first = words.charAt(0);
  const rest = words.slice(1);
  el.innerHTML = `
    <p class="ref">${ref}</p>
    <p class="text"><span class="cap">${first}</span>${rest}</p>
    <div class="rail">
      <button class="save ${isSaved(ref)?'on':''}" aria-label="Keep verse">${svg('heart')}<span class="lab">Keep</span></button>
      <button class="copy" aria-label="Copy verse">${svg('copy')}<span class="lab">Copy</span></button>
      <button class="share" aria-label="Share verse">${svg('share')}<span class="lab">Share</span></button>
    </div>`;
  el.dataset.ref = ref; el.dataset.text = text;

  el.querySelector('.save').addEventListener('click',e=>{ toggleSave(ref,text,e.currentTarget); });
  el.querySelector('.copy').addEventListener('click',e=>{ copyVerse(ref,text); burst(e.currentTarget); });
  el.querySelector('.share').addEventListener('click',e=>{ shareVerse(ref,text); burst(e.currentTarget); });
  served++;
  return el;
}

function appendBatch(n=4){ for(let i=0;i<n;i++){ const [r,t]=nextVerse(); feed.appendChild(makeCard(r,t)); } }

/* ---------- reveal / infinite ---------- */
const io = new IntersectionObserver((ents)=>{
  ents.forEach(en=>{
    if(en.isIntersecting && en.intersectionRatio>0.6){
      en.target.classList.add('live');
      const cards=[...feed.children];
      if(cards.indexOf(en.target) >= cards.length-3){ appendBatch(4); topUpFromNet(); }
      if(served>1) hideHint();
    }
  });
},{root:feed, threshold:[0.6]});

const mo = new MutationObserver(recs=>recs.forEach(r=>r.addedNodes.forEach(n=>{ if(n.nodeType===1) io.observe(n); })));
mo.observe(feed,{childList:true});

/* ---------- actions ---------- */
function persist(){ localStorage.setItem('selah.saved', JSON.stringify(saved)); document.getElementById('savedCount').textContent=saved.length; }
function toggleSave(ref,text,btn){
  const i = saved.findIndex(s=>s[0]===ref);
  if(i>=0){ saved.splice(i,1); btn?.classList.remove('on'); toast('Removed'); }
  else{ saved.unshift([ref,text]); btn?.classList.add('on'); btn?.classList.add('burst'); setTimeout(()=>btn?.classList.remove('burst'),400); toast('Kept'); }
  persist(); if(navigator.vibrate) navigator.vibrate(8);
}
async function copyVerse(ref,text){
  const s = `“${text}”\n— ${ref} (WEB)`;
  try{ await navigator.clipboard.writeText(s); toast('Copied'); }
  catch{ toast('Copy unavailable'); }
}
async function shareVerse(ref,text){
  const s = `“${text}”\n— ${ref}`;
  if(navigator.share){ try{ await navigator.share({text:s, title:'Selah'}); }catch{} }
  else copyVerse(ref,text);
}
function burst(btn){ btn.classList.add('burst'); setTimeout(()=>btn.classList.remove('burst'),400); if(navigator.vibrate) navigator.vibrate(6); }

let toastT;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1400); }

let hintGone=false;
function hideHint(){ if(hintGone) return; hintGone=true; document.getElementById('hint').style.opacity='0'; setTimeout(()=>document.getElementById('hint').remove(),600); }

/* ---------- saved drawer ---------- */
const sheet=document.getElementById('sheet');
document.getElementById('openSaved').addEventListener('click',openSaved);
document.getElementById('closeSaved').addEventListener('click',()=>sheet.classList.remove('open'));
function openSaved(){
  const list=document.getElementById('savedList');
  if(!saved.length){ list.innerHTML='<div class="empty"><b>Nothing kept yet</b>Tap Keep on a verse and it waits for you here.</div>'; }
  else list.innerHTML = saved.map((s,i)=>`
    <div class="savedItem">
      <div class="r">${s[0]}</div>
      <div class="t">“${s[1]}”</div>
      <button data-i="${i}">Remove</button>
    </div>`).join('');
  list.querySelectorAll('button[data-i]').forEach(b=>b.addEventListener('click',()=>{
    saved.splice(+b.dataset.i,1); persist();
    document.querySelectorAll('.verse .save.on').forEach(x=>{});
    openSaved();
  }));
  sheet.classList.add('open');
}

/* ---------- live infinite top-up (World English Bible via bible-api.com) ---------- */
let netBusy=false, netOK=true;
async function topUpFromNet(){
  if(netBusy || !netOK || !navigator.onLine) return;
  netBusy=true;
  try{
    const res = await Promise.all([fetchRandom(),fetchRandom(),fetchRandom()]);
    res.filter(Boolean).forEach(v=>{ if(!POOL.some(p=>p[0]===v[0])) POOL.push(v); });
  }catch{ netOK=false; }
  netBusy=false;
}
async function fetchRandom(){
  try{
    const r = await fetch('https://bible-api.com/data/web/random');
    if(!r.ok) return null;
    const d = await r.json();
    const v = d.random || (d.verses && d.verses[0]);
    if(!v) return null;
    const ref = `${v.book} ${v.chapter}:${v.verse}`;
    const text = (v.text||'').replace(/\s+/g,' ').trim();
    if(text.length<12 || text.length>240) return null;   // keep cards scroll-sized
    return [ref, text];
  }catch{ return null; }
}

/* ---------- boot ---------- */
persist();
refillDeck();
appendBatch(5);
requestAnimationFrame(()=>{ feed.firstElementChild?.classList.add('live'); });
topUpFromNet();

    name:"Selah", short_name:"Selah", start_url:".", display:"standalone",
    background_color:"#0b0e1a", theme_color:"#0b0e1a", orientation:"portrait",
    description:"Scroll the Word.",
    icons:[{src:"data:image/svg+xml,"+encodeURIComponent('<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"512\" height=\"512\"><rect width=\"512\" height=\"512\" fill=\"#0b0e1a\"/><text x=\"256\" y=\"340\" font-size=\"300\" text-anchor=\"middle\" fill=\"#d9b45f\" font-family=\"Georgia,serif\">S</text></svg>'), sizes:"512x512", type:"image/svg+xml"}]
  };
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
  const link=document.createElement('link'); link.rel='manifest'; link.href=URL.createObjectURL(blob); document.head.appendChild(link);
})();
window.addEventListener('online',()=>{ netOK=true; topUpFromNet(); });
</script>
